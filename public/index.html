<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>扑克牌钓鱼</title><link rel="stylesheet" href="/style.css"></head><body><main class="app"><header><div><div class="eyebrow">双人实时扑克游戏</div><h1>扑克牌钓鱼</h1></div><div class="header-actions"><div id="roomBadge" class="room-badge hidden"></div><button id="backLobby" class="back-lobby hidden">返回大厅</button></div></header><section id="lobby" class="panel"><div class="tabs"><button class="tab active" data-tab="create">创建房间</button><button class="tab" data-tab="join">加入房间</button></div><div id="createForm" class="form"><label>你的昵称<input id="createName" maxlength="12" placeholder="例如：小鱼"></label><button id="createBtn" class="primary">创建房间</button></div><div id="joinForm" class="form hidden"><label>你的昵称<input id="joinName" maxlength="12" placeholder="例如：小鱼"></label><label>房间号<input id="joinCode" inputmode="numeric" maxlength="6" placeholder="6位房间号"></label><button id="joinBtn" class="primary">加入房间</button></div><div class="local-test"><button id="localBtn">电脑试玩模式</button><p class="hint">只有一台电脑时使用：与电脑对战：自动出拳、出牌和抢铃，反应时间约 1.4 秒。</p></div><p class="hint">两台手机打开同一个网址，创建者把房间号发给另一位玩家即可。</p></section><section id="game" class="hidden"><div id="timer" class="hint"></div><div id="status" class="status"></div><div class="players"><div id="p0" class="player-card"></div><div id="p1" class="player-card"></div></div><div class="table-wrap"><div class="table-title">桌面牌堆 <span id="tableCount"></span></div><div id="table" class="table"></div><div id="emptyTable" class="empty">等待出牌</div></div><div id="controls" class="controls"></div><div id="reward" class="reward hidden"></div><div id="rules" class="rules"><b>操作提示</b><span>轮到你时点击“随机出牌”；出现对子、J 或王时，任何人都能抢铃。</span></div></section><div id="toast" class="toast"></div></main><script src="/app.js"></script></body></html>
